name: Daily OISST pull

on:
  schedule:
    # Run at 12:00 UTC every day
    - cron: "0 12 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git history (commits)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run daily pull
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
        run: |
          cd ${{ github.workspace }}
          .venv/bin/python -m enso_watch.pull

      - name: Commit and push the new data
        run: |
          cd ${{ github.workspace }}
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Find the newly created JSON file
          NEW_FILE=$(ls -1 data/enso-watch-*.json | tail -n 1)
          
          if [ -n "$NEW_FILE" ]; then
            git add "$NEW_FILE" data/official.json
            git commit -m "Daily pull: $(basename $NEW_FILE)" -m "Generated by GitHub Actions."
            git push
          else
            echo "No new data file found. Skipping commit."
            exit 0
          fi
